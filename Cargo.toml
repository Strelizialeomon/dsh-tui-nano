[workspace]
members = [
    "crates/nano-runtime",
    "crates/nano-conversation",
    "crates/nano-terminal",
    "crates/nano-transcript",
    "crates/nano-decisions",
    "crates/nano-schedule",
    "crates/nano-attachments",
    "crates/nano-controls",
    "crates/nano-skills",
    "crates/nano-jobs",
    "crates/nano-monitor",
    "crates/nano-sessions",
    "crates/nano-subagents",
    "crates/nano-app",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.82"
