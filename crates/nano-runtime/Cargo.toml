[package]
name = "nano-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust side of the Nano host: profile preflight, fd 3/4 NDJSON transport, lifecycle, subscriptions, and bounded shutdown"

[dependencies]
libc = "0.2"
os_pipe = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
