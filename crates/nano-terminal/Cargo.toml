[package]
name = "nano-terminal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "S09 interactive terminal view: official PTY attachment, VT parsing, input sequencing, scrolling and selection"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
# Frozen parser/widget pair. tui-term 0.2 is the ratatui 0.29 line and re-exports
# the matching vt100, so the parser and renderer cannot drift apart.
vt100 = "=0.15.2"
tui-term = "=0.2.0"
