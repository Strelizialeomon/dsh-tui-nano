[package]
name = "nano-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Nano TUI application shell: terminal input, conversation host, scene and focus routing"

[[bin]]
name = "nano"
path = "src/main.rs"

[dependencies]
nano-runtime = { path = "../nano-runtime" }
nano-conversation = { path = "../nano-conversation" }
nano-jobs = { path = "../nano-jobs" }
nano-controls = { path = "../nano-controls" }
nano-sessions = { path = "../nano-sessions" }
nano-skills = { path = "../nano-skills" }
serde_json = "1"
crossterm = "0.28"
ratatui = "0.29"
unicode-width = "0.2"
