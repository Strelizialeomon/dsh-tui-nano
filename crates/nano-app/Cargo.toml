[package]
name = "nano-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Nano TUI application shell: terminal input, conversation host, scene and focus routing"

[[bin]]
name = "nano"
path = "src/main.rs"

[dependencies]
nano-runtime = { path = "../nano-runtime" }
nano-conversation = { path = "../nano-conversation" }
nano-schedule = { path = "../nano-schedule" }
serde_json = "1"
crossterm = "0.28"
ratatui = "0.29"
unicode-width = "0.2"
