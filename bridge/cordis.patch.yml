# The Nano bridge bundle patch. It inserts the bridge app, the model-facing
# question tool, and the official @file discovery provider, and disables HMR so
# a runtime profile cannot recompose itself underneath a live Rust window. The
# launcher-supplied --patch overlay sets the per-session storage roots and the
# nano-bridge config; this file only owns the stable row set.

- insert:
    - id: nano-bridge
      name: '@dsh-tui-nano/bridge'

    # S09 mounts the official user-terminal service. It is deliberately not
    # exposed to the Agent tool table or Monitor; only the S09 UI calls it.
    # dsh-base already provides subprocess, sandboxPolicy, workingDirectory and
    # typert, which the controller injects.
    - id: terminal-controller
      name: '@deepseek-ai/dsh-api-terminal-controller'

    # The question seam (ctx.userQuestions) is in dsh-base; this tool is the
    # model-facing half. S03 registers the answerer. The shipped default is the
    # blocking schema; timed mode is an S03 decision, not an S01 default.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    # S06 `@file` completion. The minimal dsh-base composition does not mount
    # the file-reference provider, while the web bundle does. Discovery is
    # path-only; selecting a candidate never reads the file.
    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'
      config:
        maxResults: 20

- id: hmr
  disabled: true
